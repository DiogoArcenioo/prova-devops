services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5433:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db-network

  front:
    build:
      context: ../front
      dockerfile: Dockerfile
    container_name: front-react
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - app-network

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: api-nestjs
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      - postgres
    networks:
      - db-network
      - app-network

volumes:
  postgres_data:

networks:
  db-network:
  app-network:
